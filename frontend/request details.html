<!DOCTYPE html>
<html>
<head>
  <title>Emergency Request Details</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f0f4f7;
      margin: 0;
      padding: 20px;
    }
    h1 {
      text-align: center;
      color: darkred;
    }
    .request-table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 20px;
    }
    .request-table th, .request-table td {
      border: 2px solid #333;
      padding: 10px;
      text-align: center;
    }
    .request-table th {
      background: #ddd;
    }
    button {
      padding: 6px 12px;
      margin: 2px;
      background: darkred;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }
    button:hover {
      background: maroon;
    }
  </style>
</head>
<body>
  <nav style="background:#dae8eb; padding:10px;">
  <a href="home.html" style="color:rgb(19, 15, 15); margin-right:15px; text-decoration:none;">Home</a>
  <a href="Registerform.html" style="color:rgb(18, 14, 14); margin-right:15px; text-decoration:none;">Register Donor</a>
  <a href="Finddonors.html" style="color:rgb(19, 15, 15); margin-right:15px; text-decoration:none;">Find Donors</a>
  <a href="Emergencyrequest details.html" style="color:rgb(19, 15, 15); margin-right:15px; text-decoration:none;">Emergency Requests</a>
  <a href="request details.html" style="color:rgb(19, 15, 15); margin-right:15px; text-decoration:none;">Requests details</a>

  <h1>Emergency Request Details</h1>

  <table class="request-table" id="requestTable">
    <tr>
      <th>Patient</th>
      <th>Blood Group</th>
      <th>Hospital / Location</th>
      <th>Contact</th>
      <th>Urgency</th>
      <th>Notes</th>
      <th>Actions</th>
    </tr>
  </table>

<script>
async function loadRequests() {
  try {
    const response = await fetch("http://localhost:3000/requests");
    const requests = await response.json();

    const table = document.getElementById("requestTable");
    table.innerHTML = `
      <tr>
        <th>Patient</th>
        <th>Blood Group</th>
        <th>Hospital / Location</th>
        <th>Contact</th>
        <th>Urgency</th>
        <th>Notes</th>
        <th>Actions</th>
      </tr>
    `;

    if (requests.length === 0) {
      const row = document.createElement("tr");
      row.innerHTML = `<td colspan="7">No emergency requests found</td>`;
      table.appendChild(row);
      return;
    }

    requests.forEach(req => {
      const row = document.createElement("tr");
      row.innerHTML = `
        <td>${req.patient}</td>
        <td>${req.blood}</td>
        <td>${req.hospital || req.location}</td>
        <td>${req.contact}</td>
        <td>${req.urgency || "Not specified"}</td>
        <td>${req.notes || ""}</td>
        <td>
          <button onclick="updateRequest(${req.id})">Update</button>
          <button onclick="deleteRequest(${req.id})">Delete</button>
        </td>
      `;
      table.appendChild(row);
    });
  } catch (error) {
    alert("Error loading requests: " + error);
  }
}

async function deleteRequest(id) {
  if (!confirm("Are you sure you want to delete this request?")) return;
  try {
    const response = await fetch(`http://localhost:3000/requests/${id}`, { method: "DELETE" });
    const result = await response.text();
    alert(result);
    loadRequests();
  } catch (error) {
    alert("Error deleting request: " + error);
  }
}

async function updateRequest(id) {
  const patient = prompt("Enter new patient name:");
  const blood = prompt("Enter new blood group:");
  const hospital = prompt("Enter new hospital/location:");
  const contact = prompt("Enter new contact number:");
  const urgency = prompt("Enter urgency (High, Medium, Low):");
  const notes = prompt("Enter notes:");

  if (!patient || !blood || !hospital || !contact) {
    alert("Patient, blood, hospital/location, and contact are required.");
    return;
  }

  try {
    const response = await fetch(`http://localhost:3000/requests/${id}`, {
      method: "PUT",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ patient, blood, hospital, contact, urgency, notes })
    });
    const result = await response.text();
    alert(result);
    loadRequests();
  } catch (error) {
    alert("Error updating request: " + error);
  }
}

// Load requests on page open
loadRequests();
</script>

</body>
</html>
